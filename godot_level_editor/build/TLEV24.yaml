level_info:
  magic_number: EF AC 13 01
  background_color: 3
  title: Pool Balls, Walls, Cues
  goal_description: Put the 6-ball into the bottom right corner pocket.
environment:
  pressure: 67
  gravity: 272
  music_track: 1021
hints:
  active_hints_count: 6
  entries:
  - hint_id: 1
    x: 449
    y: -5
    icon_flip: 0
    text: Bump this button on the back of the pool cue to make it spring forward.
  - hint_id: 2
    x: 195
    y: 79
    icon_flip: 0
    text: Change the angle at which the pool ball is hit to create a different trajectory.
  - hint_id: 3
    x: 243
    y: 171
    icon_flip: 3
    text: These pockets can be rotated to fit any angle on a pool table. If you get
      a ball close enough to the hole, it will go in.
  - hint_id: 4
    x: 107
    y: 125
    icon_flip: 0
    text: This wall can be stretched just like any other. It can also be flipped to
      a vertical position.
  - hint_id: 5
    x: 261
    y: 53
    icon_flip: 1
    text: The pool cue can be rotated to 8 different angles.
  - hint_id: 6
    x: 175
    y: 130
    icon_flip: 2
    text: The number on the pool ball can be programmed from 1 to 15. All of the pool
      balls react the same way.
