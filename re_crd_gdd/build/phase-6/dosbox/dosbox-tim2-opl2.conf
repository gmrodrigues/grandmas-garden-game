# DOSBox-X config for TIM2 OPL2 register capture
# Usage: dosbox-x -conf dosbox-tim2-opl2.conf
#
# This config:
#   - Mounts the TIM2 game directory as C:
#   - Uses SB16 with OPL2 emulation (nuked = most accurate)
#   - Enables sblaster debug logging to capture OPL2 register writes
#   - Sets capture directory for WAV recordings (Ctrl+F6)
#   - Redirects logs to build/phase-6/dosbox/

[sdl]
fullscreen=false
output=overlay
windowresolution=960x720
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper-0.74-3.map
usescancodes=true

[dosbox]
language=
machine=svga_s3
captures=build/phase-6/dosbox/capture
memsize=16

[render]
frameskip=0
aspect=true
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=8000
cycleup=500
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=25

[midi]
mpu401=intelligent
mididevice=default
midiconfig=

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=opl2
oplemu=nuked
oplrate=49716

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100

[log]
logfile=build/phase-6/dosbox/opl2-capture.log
sblaster=debug
vgagfx=false
vgamisc=false
int10=false
dma_control=false
fpu=false
cpu=false
paging=false
fcb=false
files=false
ioctl=false
exec=false
dosmisc=false
pit=false
keyboard=false
pic=false
mouse=false
bios=false
io=false

[autoexec]
mount c /home/glauber/gmrodrigues.github.com/the-incredible-machine-2-reverse-engineering
c:
echo =============================================
echo TIM2 OPL2 Register Capture Environment
echo =============================================
echo.
echo INSTRUCTIONS:
echo   1. Start TIM2 by typing: TIM2
echo   2. Trigger sound effects in-game
echo   3. Ctrl+F6 to start/stop WAV recording
echo   4. OPL2 register writes are logged to:
echo      build/phase-6/dosbox/opl2-capture.log
echo   5. WAV captures go to:
echo      build/phase-6/dosbox/capture/
echo.
echo Sound effects to trigger:
echo   - Conveyor (FM id=5)
echo   - Fan (FM id=24)
echo   - Generator (FM id=26)
echo   - Motor (FM id=50)
echo   - Vacuum (FM id=51)
echo   - Antigrav (FM id=69)
echo =============================================