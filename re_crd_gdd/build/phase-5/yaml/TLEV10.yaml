    y: 90
    icon_flip: 0
    text: When lit, this part will explode into fireworks before leaving the screen.
      It's a programmable part.
  - hint_id: 4
    x: 390
    y: 128
    icon_flip: 1
    text: Missiles and rockets can be launched horizontally, fireworks can't.
