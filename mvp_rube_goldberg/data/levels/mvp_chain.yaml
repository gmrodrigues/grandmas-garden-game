# MVP Chain Level — Phase A: Data-Driven Levels
# Converted from hardcoded _setup_board() in Main.gd
# Chain logic (timer → gear → rope → gate → ball → laser → fan → balloon → thorns)
# is preserved as inline_script until SOLVE.RES data-driven approach is implemented.

meta:
  title: "MVP Chain"
  objective: "Guide the balloon into the thorns"
  description: "Full 7-pass physics chain: timer counts to 120, triggers gear which lifts gate via rope, ball falls and hits laser, laser powers fan which pushes balloon into thorns."
  hints:
    - "Wait for the timer to reach 120 ticks"
    - "The gear activates the rope which lifts the gate"
    - "The ball must hit the laser switch"
    - "The fan pushes the balloon toward the thorns"
  music: null

physics:
  gravity_x: 0
  gravity_y: 0x2000        # Q8.8: 0x2000 >> 8 = 8.0 px/tick²
  air_pressure: 0

# fixed_parts: static scenery (walls, floor, ceiling, thorns, timer platform)
fixed_parts:
  - id: 0
    part_type: 99           # Timer / Incline
    name: "Timer"
    pos_x: 100
    pos_y: 10
    width: 64
    height: 32
    state_limit_upper: 200
    state_limit_reset: 0

  - id: 3
    part_type: 1            # Brick Wall
    name: "Gate"
    pos_x: 344
    pos_y: 60
    width: 16
    height: 64

  - id: 8
    part_type: 71           # Boxes (Thorns)
    name: "Thorns"
    pos_x: 480
    pos_y: 100
    width: 48
    height: 48

  - id: 9
    part_type: 1            # Brick Wall
    name: "WallL"
    pos_x: 0
    pos_y: 0
    width: 8
    height: 480

  - id: 10
    part_type: 1            # Brick Wall
    name: "WallR"
    pos_x: 632
    pos_y: 0
    width: 8
    height: 480

  - id: 11
    part_type: 1            # Brick Wall
    name: "Floor"
    pos_x: 0
    pos_y: 440
    width: 640
    height: 40

  - id: 12
    part_type: 1            # Brick Wall
    name: "Ceiling"
    pos_x: 0
    pos_y: 0
    width: 640
    height: 8

# moving_parts: physics-simulated parts (ball, balloon) and active parts (gear, rope, laser, fan)
moving_parts:
  - id: 1
    part_type: 6            # Mouse Motor (Gear)
    name: "Gear"
    pos_x: 180
    pos_y: 40
    width: 48
    height: 48
    collision_radius: 24
    is_moving: true
    state_limit_upper: 1
    state_limit_reset: 0

  - id: 2
    part_type: 10           # Rope
    name: "Rope"
    pos_x: 228
    pos_y: 64
    width: 8
    height: 80
    rope_segment_length: 80
    connected_1: -1         # will be set to gate (id=3) by chain logic

  - id: 4
    part_type: 0            # Bowling Ball
    name: "Ball"
    pos_x: 360
    pos_y: 50
    width: 32
    height: 32
    mass: 2832
    damping: 0
    cor_q8: 128
    friction_q8: 0
    collision_radius: 16
    is_moving: false        # starts locked; chain logic releases it
    gravity_category: 10
    gravity_buoyancy: 0
    state_limit_upper: 8
    state_limit_reset: 0

  - id: 5
    part_type: 26           # Generator (Laser Switch)
    name: "Laser"
    pos_x: 340
    pos_y: 400
    width: 48
    height: 48
    state_limit_upper: 4
    state_limit_reset: 0

  - id: 6
    part_type: 24           # Electric Fan
    name: "Fan"
    pos_x: 260
    pos_y: 48
    width: 48
    height: 48
    state_limit_upper: 2
    state_limit_reset: 0
    facing: 1
    pressure_max_vel: 10000

  - id: 7
    part_type: 4            # Balloon
    name: "Balloon"
    pos_x: 290
    pos_y: 150
    width: 40
    height: 51
    mass: 9
    damping: 64
    cor_q8: 64
    friction_q8: 0
    collision_radius: 0
    gravity_buoyancy: -2000  # floats upward
    is_moving: false         # starts locked; chain logic releases it
    state_limit_upper: 8
    triggers: ["collision", "proximity"]
    destructible: true

# Solution condition: balloon center enters the thorns zone
solution:
  type: AABB_overlap
  target_part: "Balloon"
  zone:
    x: 420
    y: 0
    width: 220
    height: 80

# Chain behavior script (temporary stand-in for SOLVE.RES data table)
# This is the same logic from Main.gd _chain_logic(), converted to a simple DSL.
# Format: [condition_part, condition_type, threshold, action_part, action, value]
chain_script:
  - [Timer, state_counter, 120, Gear, set_angular_velocity, 8]
  - [Timer, state_counter, 120, Rope, set_connected_1, 3]
  - [Gear, angular_velocity, 0, Gate, move_y, 4]
  - [Gate, pos_y, Ball, pos_y, release_ball, 10]
  - [Ball, aabb_overlap, Laser, Laser, set_powered, true]
  - [Ball, aabb_overlap, Laser, Fan, set_powered, true]
  - [Ball, aabb_overlap, Laser, Balloon, set_moving, true]
  - [Fan, is_powered, true, Fan, set_state_counter, 1]